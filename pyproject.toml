[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtape"
version = "0.1.0"
description = "Human-readable browser automation with Selenium and YAML"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "selenium>=4.49,<5"]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
test = ["pytest>=8"]
native-test = ["python-xlib>=0.33; sys_platform == 'linux'"]
build = ["PyInstaller>=6.16"]

[project.scripts]
flowtape = "flowtape.cli:main"

[tool.setuptools.package-data]
flowtape = ["observer.js", "dom.js"]
